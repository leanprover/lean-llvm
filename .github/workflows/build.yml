name: Build LLVM

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  Build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash -euxo pipefail {0}' }}
    strategy:
      matrix:
        include:
          - name: x86_64-linux-gnu
            os: nscloud-ubuntu-24.04-amd64-4x8
            container: almalinux:8  # for old glibc (2.28)
            # LLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON normally set by llvm/CMakeLists.txt but doesn't propagate to our separate runtimes build
            # the container's clang defaults to a vendor-specific triple and CMake to `lib64` there
            more-opts: -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-unknown-linux-gnu -DCMAKE_INSTALL_LIBDIR=lib -DPython3_EXECUTABLE=/usr/bin/python3.12
          - name: aarch64-linux-gnu
            os: nscloud-ubuntu-24.04-arm64-4x8
            container: almalinux:8  # for old glibc (2.28)
            more-opts: -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-unknown-linux-gnu -DCMAKE_INSTALL_LIBDIR=lib -DPython3_EXECUTABLE=/usr/bin/python3.12
          - name: x86_64-apple-darwin
            os: macos-26-intel  # still x64
            # ld64.lld: warning: Option `-reexported_symbols_list' is not yet implemented. Stay tuned...
            more-opts: -DLLVM_USE_LINKER=ld -DCMAKE_INSTALL_RPATH='@loader_path/../lib' -DCMAKE_INSTALL_NAME_DIR='@rpath' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCOMPILER_RT_ENABLE_IOS=false
          - name: aarch64-apple-darwin
            os: macos-latest
            # ld64.lld: warning: Option `-reexported_symbols_list' is not yet implemented. Stay tuned...
            more-opts: -DLLVM_USE_LINKER=ld -DCMAKE_INSTALL_RPATH='@loader_path/../lib' -DCMAKE_INSTALL_NAME_DIR='@rpath' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCOMPILER_RT_ENABLE_IOS=false
          - name: x86_64-w64-windows-gnu
            os: windows-latest
            shell: msys2 {0}
            # from https://github.com/msys2/MINGW-packages/blob/master/mingw-w64-clang/PKGBUILD
            # from https://github.com/msys2/MINGW-packages/blob/master/mingw-w64-libc%2B%2B/PKGBUILD
            # Ninja doesn't seem to work w/ ccache
            more-opts: |
              -DCMAKE_SYSTEM_IGNORE_PATH=/usr/lib -DLLVM_HOST_TRIPLE=x86_64-w64-windows-gnu -DLLD_DEFAULT_LD_LLD_IS_MINGW=ON \
              -DLIBCXX_HAS_WIN32_THREAD_API=ON -DLIBCXXABI_HAS_WIN32_THREAD_API=ON -DLIBCXX_ENABLE_SHARED=OFF -DLIBCXXABI_ENABLE_SHARED=OFF -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=ON \
              -G "Unix Makefiles" -DCMAKE_INSTALL_LIBDIR=lib -DLIBUNWIND_ENABLE_SHARED=OFF
      # complete all jobs
      fail-fast: false
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      LLVM_CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      # the compiler is freshly installed on every runner, so its mtime always differs across runs;
      # use the version string as a cache key instead
      CCACHE_COMPILERCHECK: string:%compiler% --version
      # current cache limit
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@v2
      - name: Prepare Linux x86
        if: matrix.container && contains(matrix.name, 'x86_64')
        run: |
          # multilib necessary for building compiler-rt
          dnf install -y glibc-devel.i686 libgcc.i686
      - name: Prepare
        if: matrix.container
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y clang lld compiler-rt cmake ninja-build ccache git python3.12 zstd
          # `github.workspace` is the path outside of the container
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "LLVM_CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
      - name: Prepare
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ninja ccache zstd
      - name: Prepare
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-ccache git mingw-w64-clang-x86_64-cmake make tar zstd
      - name: Restore Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ matrix.name }}-build-${{ github.sha }}
          # fall back to (latest) previous cache
          restore-keys: |
            ${{ matrix.name }}-build
      - name: Clone LLVM
        run: git clone -q --depth 1 -b llvmorg-23.1.1 --recursive https://github.com/llvm/llvm-project
      - name: Build host libc++
        if: matrix.container
        run: |
          # `LLVM_ENABLE_LIBCXX` needs a libc++ on the host but the container has no package for it
          cmake llvm-project/runtimes -G Ninja -B build/host-runtimes -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLLVM_LIBDIR_SUFFIX=64\
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLLVM_CCACHE_BUILD=ON\
            -DLLVM_ENABLE_RUNTIMES="libunwind;libcxxabi;libcxx"\
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DPython3_EXECUTABLE=/usr/bin/python3.12
          cmake --build build/host-runtimes -j$(nproc)
          cmake --install build/host-runtimes
      - name: Build
        run: |
          set -euxo pipefail
          cmake llvm-project/llvm -G Ninja -B build/llvm -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/lean-llvm -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++\
            -DLLVM_ENABLE_PROJECTS="llvm;clang;lld;compiler-rt;bolt" -DLLVM_LINK_LLVM_DYLIB=ON -DLLVM_CCACHE_BUILD=ON\
            -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBCXX=ON -DLLVM_ENABLE_FFI=OFF\
            `# https://boxbase.org/entries/2018/jun/11/minimal-llvm-build/`\
            -DLLVM_TARGETS_TO_BUILD='AArch64;WebAssembly;X86'\
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ -DCLANG_DEFAULT_LINKER=lld -DCLANG_DEFAULT_RTLIB=compiler-rt -DCOMPILER_RT_USE_BUILTINS_LIBRARY=ON\
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF\
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON\
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF\
            ${{ matrix.more-opts }}
          cmake --build build/llvm -j$(nproc)
          cmake --install build/llvm
          # LLVM wants to build the runtimes using the bootstrapped compiler via LLVM_ENABLE_RUNTIMES but that breaks horribly on Windows,
          # build as a separate project using msys LLVM as before
          cmake llvm-project/runtimes -G Ninja -B build/runtimes -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/lean-llvm -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++\
            -DLLVM_ENABLE_RUNTIMES="libunwind;libcxxabi;pstl;libcxx" -DLLVM_LINK_LLVM_DYLIB=ON -DLLVM_CCACHE_BUILD=ON\
            -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBCXX=ON -DLLVM_ENABLE_FFI=OFF\
            `# https://libcxx.llvm.org/BuildingLibcxx.html`\
            -DLIBCXX_USE_COMPILER_RT=ON -DLIBCXXABI_USE_COMPILER_RT=ON -DLIBCXXABI_USE_LLVM_UNWINDER=ON -DLIBUNWIND_USE_COMPILER_RT=ON\
            `# hide libc++ symbols in libleanshared`\
            -DLIBCXX_HERMETIC_STATIC_LIBRARY=ON -DLIBCXXABI_HERMETIC_STATIC_LIBRARY=ON\
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON\
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF\
            `# https://github.com/llvm/llvm-project/pull/84750`\
            -DLLVM_ENABLE_PIC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON\
            ${{ matrix.more-opts }}
          cmake --build build/runtimes -j$(nproc)
          cmake --install build/runtimes
          tar cf lean-llvm-${{ matrix.name }}.tar.zst --use-compress-program="zstd -19" lean-llvm/
      - name: Sanity test
        run: lean-llvm/bin/clang -v
      - name: Check glibc requirement
        if: matrix.container
        run: |
          max=$({ find lean-llvm/bin lean-llvm/lib -type f -exec objdump -T {} + 2>/dev/null || true; } | { grep -o 'GLIBC_[0-9.]*' || true; } | sort -uV | tail -n1)
          echo "newest required glibc symbol version: $max"
          [[ "$(printf '%s\n' GLIBC_2.28 "$max" | sort -V | tail -n1)" == GLIBC_2.28 ]]
      - name: CCache stats
        run: ccache -s
      - name: Save Cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ matrix.name }}-build-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: lean-llvm-${{ matrix.name }}
          path: '*.tar.*'
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: '*.tar.*'
